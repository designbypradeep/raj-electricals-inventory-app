name: Build Apps (iOS IPA & Android APKs)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/custom-sale-price
      - main

jobs:
  # ==========================================
  # iOS Build Job (Runs on macOS)
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Application (Release, Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 Inventoza.ipa Payload
          cd ../../..

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: inventoza-ios-ipa
          path: build/ios/iphoneos/Inventoza.ipa
          retention-days: 14

  # ==========================================
  # Android Build Job (Runs on fast Linux)
  # ==========================================
  build-android:
    name: Build Android APKs (Admin & Shop)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Admin Release APK
        run: flutter build apk --release --flavor admin

      - name: Build Shop Release APK
        run: flutter build apk --release --flavor shop

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: inventoza-admin-apk
          path: build/app/outputs/flutter-apk/app-admin-release.apk
          retention-days: 14

      - name: Upload Shop APK
        uses: actions/upload-artifact@v4
        with:
          name: inventoza-shop-apk
          path: build/app/outputs/flutter-apk/app-shop-release.apk
          retention-days: 14
