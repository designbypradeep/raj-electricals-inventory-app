name: Build Apps (iOS IPAs & Android APKs)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/custom-sale-price
      - main

jobs:
  # ==========================================
  # iOS Build Matrix (Admin & Shop in parallel on macOS)
  # ==========================================
  build-ios:
    name: Build iOS (${{ matrix.app_name }})
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_type: admin
            app_name: Inventoza-Admin
            bundle_id: com.example.rajElectricalsInventoryApp
            display_name: Inventoza
            artifact_name: inventoza-admin-ios-ipa
          - app_type: shop
            app_name: Inventoza-Shop
            bundle_id: com.example.rajElectricalsInventoryApp.shop
            display_name: "Inventoza Shop"
            artifact_name: inventoza-shop-ios-ipa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure iOS Bundle & Display Name
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.example.rajElectricalsInventoryApp;/PRODUCT_BUNDLE_IDENTIFIER = ${{ matrix.bundle_id }};/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName '${{ matrix.display_name }}'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string '${{ matrix.display_name }}'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName '${{ matrix.display_name }}'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleName string '${{ matrix.display_name }}'" ios/Runner/Info.plist

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS Application (Release, Unsigned)
        run: flutter build ios --release --no-codesign --dart-define=APP_TYPE=${{ matrix.app_type }}

      - name: Package Payload into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 ${{ matrix.app_name }}.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/ios/iphoneos/${{ matrix.app_name }}.ipa
          retention-days: 14

  # ==========================================
  # Android Build Job (Runs on fast Linux)
  # ==========================================
  build-android:
    name: Build Android APKs (Admin & Shop)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Admin Release APK
        run: flutter build apk --release --flavor admin

      - name: Build Shop Release APK
        run: flutter build apk --release --flavor shop

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: inventoza-admin-apk
          path: build/app/outputs/flutter-apk/app-admin-release.apk
          retention-days: 14

      - name: Upload Shop APK
        uses: actions/upload-artifact@v4
        with:
          name: inventoza-shop-apk
          path: build/app/outputs/flutter-apk/app-shop-release.apk
          retention-days: 14
